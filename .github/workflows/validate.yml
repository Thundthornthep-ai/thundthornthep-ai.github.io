name: Validate LAS Knowledge publication gates

# Fail-closed publication guard. Every article release must pass the citation
# firewall, the content rules, the internal-link and sitemap checks, the
# exact-slug/series registry checks, and the existing hub checks. Scope: articles/,
# en/articles/ and the blog pages registered as legally reviewed in
# learning-hub/legal-reviews.json (scripts/las_public_pages.py).

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'articles/**'
      - 'en/articles/**'
      # Reviewed legal blog pages (learning-hub/legal-reviews.json) are gated; the other blog pages trigger the
      # site-wide content rules (U+FFFD, 'ดร.' prefix) only.
      - 'blog/**'
      - 'en/blog/**'
      - 'learning-hub/**'
      # Tooltip titles in the site scripts are checked by the content rules (CR14).
      - 'js/**'
      - 'scripts/validate-knowledge-hub.js'
      - 'scripts/validate-knowledge-slugs.js'
      - 'scripts/resolve-validate-range.sh'
      - 'scripts/test-resolve-validate-range.sh'
      - 'scripts/verify-legal-citations.sh'
      - 'scripts/public-citation-firewall.py'
      - 'scripts/test-public-citation-firewall.py'
      - 'scripts/las_public_pages.py'
      - 'scripts/validate-content-rules.py'
      - 'scripts/check-template-structure.py'
      - 'scripts/check-internal-links.py'
      - 'scripts/check-sitemap-coverage.py'
      - 'scripts/test-content-gates.py'
      - 'scripts/validate-bkk-election.js'
      - 'scripts/legal-kb/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'articles/**'
      - 'en/articles/**'
      # Reviewed legal blog pages (learning-hub/legal-reviews.json) are gated; the other blog pages trigger the
      # site-wide content rules (U+FFFD, 'ดร.' prefix) only.
      - 'blog/**'
      - 'en/blog/**'
      - 'learning-hub/**'
      # Tooltip titles in the site scripts are checked by the content rules (CR14).
      - 'js/**'
      - 'scripts/validate-knowledge-hub.js'
      - 'scripts/validate-knowledge-slugs.js'
      - 'scripts/resolve-validate-range.sh'
      - 'scripts/test-resolve-validate-range.sh'
      - 'scripts/verify-legal-citations.sh'
      - 'scripts/public-citation-firewall.py'
      - 'scripts/test-public-citation-firewall.py'
      - 'scripts/las_public_pages.py'
      - 'scripts/validate-content-rules.py'
      - 'scripts/check-template-structure.py'
      - 'scripts/check-internal-links.py'
      - 'scripts/check-sitemap-coverage.py'
      - 'scripts/test-content-gates.py'
      - 'scripts/validate-bkk-election.js'
      - 'scripts/legal-kb/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release comparison range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          range_out="$(bash scripts/resolve-validate-range.sh)"
          printf '%s\n' "$range_out" >> "$GITHUB_OUTPUT"
          base="$(printf '%s\n' "$range_out" | sed -n 's/^base=//p')"
          target="$(printf '%s\n' "$range_out" | sed -n 's/^target=//p')"
          reason="$(printf '%s\n' "$range_out" | sed -n 's/^reason=//p')"
          echo "Comparing $base..$target ($reason)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test exact-slug comparison range resolver
        run: bash scripts/test-resolve-validate-range.sh

      - name: Run citation firewall unit tests
        run: python3 scripts/test-public-citation-firewall.py

      - name: Run content-gate unit tests
        run: python3 scripts/test-content-gates.py

      - name: Run citation firewall (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # Publication-wide: official PDF-box cites live across the set, so a
          # registry or firewall change must re-check every tracked article and
          # every reviewed blog page. One firewall process loads the registry once.
          bash scripts/verify-legal-citations.sh --all

      - name: Run content rules (fail closed)
        if: success() || failure()
        run: python3 scripts/validate-content-rules.py

      - name: Report locked template structure (report only)
        if: success() || failure()
        # Lists the article pages that miss a locked template part (quick answer, Practice Note, counterargument, FAQ,
        # references, disclaimer, table). Legacy pages are reported, not failed; a new page is gated by naming it with
        # --strict.
        run: python3 scripts/check-template-structure.py

      - name: Run internal link check (fail closed)
        if: success() || failure()
        run: python3 scripts/check-internal-links.py

      - name: Run sitemap coverage check (fail closed)
        if: success() || failure()
        run: python3 scripts/check-sitemap-coverage.py

      - name: Run exact slug and series validator
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact-slug range ${{ steps.range.outputs.base }}..${{ steps.range.outputs.target }} (${{ steps.range.outputs.reason }})"
          mapfile -t files < <(git diff --name-only "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.target }}" -- 'articles/las-share-[0-9][0-9].html' 'articles/las-shield-[0-9][0-9].html' 'articles/las-cc-[0-9][0-9].html' 'articles/las-upsize-[0-9][0-9].html' 'articles/las-invest-[0-9][0-9].html')
          if ((${#files[@]} == 0)); then
            echo "No changed LAS series article HTML — exact-slug gate not applicable."
            exit 0
          fi
          echo "Changed LAS series article HTML (${#files[@]}):"
          printf '  %s\n' "${files[@]}"
          for file in "${files[@]}"; do
            node scripts/validate-knowledge-slugs.js --slug "${file#articles/}"
          done

      - name: Run exact slug and series validator on the whole publication
        if: success() || failure()
        # Index, hub, all-content and sitemap routes are checked on every run, not only when a series file changes.
        run: node scripts/validate-knowledge-slugs.js --all

      - name: Run knowledge-hub validator
        if: success() || failure()
        run: node scripts/validate-knowledge-hub.js

      - name: Run Bangkok council election page validator
        if: success() || failure()
        # The election campaign pages are outside the Knowledge Hub and the citation gate; this keeps their own
        # structural checks (45 at the time of writing) running when blog/** changes.
        run: node scripts/validate-bkk-election.js

      - name: Summary on failure
        if: failure()
        run: |
          echo "::error::LAS Knowledge publication gate failed. Run the citation, content-rules, link, sitemap, exact-slug and hub validators locally to see details."
          echo "See docs/BILINGUAL-CONVENTION.md for the bilingual class standard."
