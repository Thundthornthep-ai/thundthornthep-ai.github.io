name: Validate LAS Knowledge publication gates

# Fail-closed publication guard. Every article release must pass the citation
# firewall, exact-slug/series registry checks, and the existing hub checks.

on:
  push:
    branches: [main]
    paths:
      - 'knowledge-hub.html'
      - 'all-content.html'
      - 'sitemap.xml'
      - 'las-*.html'
      - 'articles/**'
      - 'en/articles/**'
      - 'scripts/validate-knowledge-hub.js'
      - 'scripts/validate-knowledge-slugs.js'
      - 'scripts/resolve-validate-range.sh'
      - 'scripts/test-resolve-validate-range.sh'
      - 'scripts/verify-legal-citations.sh'
      - 'scripts/public-citation-firewall.py'
      - 'scripts/test-public-citation-firewall.py'
      - 'scripts/legal-kb/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'knowledge-hub.html'
      - 'all-content.html'
      - 'sitemap.xml'
      - 'las-*.html'
      - 'articles/**'
      - 'en/articles/**'
      - 'scripts/validate-knowledge-hub.js'
      - 'scripts/validate-knowledge-slugs.js'
      - 'scripts/resolve-validate-range.sh'
      - 'scripts/test-resolve-validate-range.sh'
      - 'scripts/verify-legal-citations.sh'
      - 'scripts/public-citation-firewall.py'
      - 'scripts/test-public-citation-firewall.py'
      - 'scripts/legal-kb/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release comparison range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          range_out="$(bash scripts/resolve-validate-range.sh)"
          printf '%s\n' "$range_out" >> "$GITHUB_OUTPUT"
          base="$(printf '%s\n' "$range_out" | sed -n 's/^base=//p')"
          target="$(printf '%s\n' "$range_out" | sed -n 's/^target=//p')"
          reason="$(printf '%s\n' "$range_out" | sed -n 's/^reason=//p')"
          echo "Comparing $base..$target ($reason)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test exact-slug comparison range resolver
        run: bash scripts/test-resolve-validate-range.sh

      - name: Run citation firewall unit tests
        run: python3 scripts/test-public-citation-firewall.py

      - name: Run citation firewall (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # Publication-wide: official PDF-box cites live across the set, so a
          # registry or firewall change must re-check every tracked article.
          bash scripts/verify-legal-citations.sh --all

      - name: Run exact slug and series validator
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact-slug range ${{ steps.range.outputs.base }}..${{ steps.range.outputs.target }} (${{ steps.range.outputs.reason }})"
          mapfile -t files < <(git diff --name-only "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.target }}" -- 'articles/las-share-[0-9][0-9].html' 'articles/las-shield-[0-9][0-9].html' 'articles/las-cc-[0-9][0-9].html' 'articles/las-upsize-[0-9][0-9].html' 'articles/las-invest-[0-9][0-9].html')
          if ((${#files[@]} == 0)); then
            echo "No changed LAS series article HTML — exact-slug gate not applicable."
            exit 0
          fi
          echo "Changed LAS series article HTML (${#files[@]}):"
          printf '  %s\n' "${files[@]}"
          for file in "${files[@]}"; do
            node scripts/validate-knowledge-slugs.js --slug "${file#articles/}"
          done

      - name: Run knowledge-hub validator
        run: node scripts/validate-knowledge-hub.js

      - name: Summary on failure
        if: failure()
        run: |
          echo "::error::LAS Knowledge publication gate failed. Run the citation, exact-slug, and hub validators locally to see details."
          echo "See docs/BILINGUAL-CONVENTION.md for the bilingual class standard."
